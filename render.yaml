services:
  - type: web
    name: triply-mate
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run frontend.py --server.port $PORT --server.address 0.0.0.0 --server.headless true
    healthCheckPath: /_stcore/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: GROQ_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: AVIATIONSTACK_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
